name: test

on:
  push:
    branches:
      - master
      - '*-stable'

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false

      matrix:
        ruby:
          - 2.3.8
          - 2.4.10
          - 2.5.8
          - 2.6.6
          - 2.7.1
          - 3.0.0
          - 3.1.2
          - '3.2'
          - jruby-9.2.11.1
          - jruby-9.4
        include:
          # The Bundler in Gemfile.lock can't run on newer Rubies, and newer
          # Bundlers can't run on Ruby < 2.6, so these use their own Bundler.
          - ruby: '3.3'
            bundler: default
          - ruby: '3.4'
            bundler: default
          - ruby: '4.0'
            bundler: default
          - ruby: jruby-10.0
            bundler: default
          - ruby: ruby-head
            bundler: default

    env:
      LANG: en_US.UTF-8
      BUNDLE_VERSION: system

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        if: startsWith(matrix.ruby, 'jruby-10')
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler || 'Gemfile.lock' }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec
        continue-on-error: ${{ matrix.ruby == 'ruby-head' }}

  lint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rake rubocop
